name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python probes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: |
          for suite in Tests/EnvironmentDiagnostics Tests/AFCThumbnail Tests/AFCAssetCopy Tests/AFCLivePhoto; do
            echo "::group::$suite"
            python3 -m unittest discover -s "$suite"
            echo "::endgroup::"
          done

  macos:
    name: Swift build and tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Tests
        run: swift test
      - name: Render catalog screens
        run: LPS_RENDER_DIR="$PWD/.build/screens" swift test --filter PhoneCatalogViewRenderTests
      - name: Upload screens
        uses: actions/upload-artifact@v4
        with:
          name: catalog-screens
          path: .build/screens/*.png
          if-no-files-found: error
          retention-days: 14
      - name: App bundle and signature
        run: zsh scripts/build-app.sh
