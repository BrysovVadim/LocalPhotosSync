name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python probes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: |
          for suite in Tests/EnvironmentDiagnostics Tests/AFCThumbnail Tests/AFCAssetCopy Tests/AFCLivePhoto; do
            echo "::group::$suite"
            python3 -m unittest discover -s "$suite"
            echo "::endgroup::"
          done

  macos:
    name: Swift build and tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Tests
        shell: bash
        run: |
          set +e
          swift test 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
          status=${PIPESTATUS[0]}
          # Logs need a GitHub sign-in; annotations are public, so surface the first failures there.
          grep -E "error:|failed \(" "$RUNNER_TEMP/swift-test.log" | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit "$status"
      - name: Render screens
        run: LPS_RENDER_DIR="$PWD/.build/screens" swift test --filter 'RenderTests'
      - name: Upload screens
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: .build/screens/*.png
          if-no-files-found: error
          retention-days: 14
      - name: App bundle and signature
        run: |
          zsh scripts/build-app.sh
          test -s ".build/LocalPhotosSync USB.app/Contents/Resources/AppIcon.icns"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" ".build/LocalPhotosSync USB.app/Contents/Info.plist"
